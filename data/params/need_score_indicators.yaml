# Indicator spec for M2. s = clip((x - safe)/(crisis - safe), 0, 1)  (direction is encoded by safe vs crisis order).
# status: verified | assumption | mock.  Starting point: Lebanon Health Sector severity/PiN thresholds (2024 annex);
# Removed for now (no public source; re-add when MoPH/NGO data exist): posts_unfilled_share, referral_incompletion (staffing_referrals).
# deviations documented in the `source` field. ALL safe/crisis values are assumptions unless marked verified.
domain_weights: {clinical_demand: 0.25, capacity_strain: 0.30, vulnerability: 0.30, environment: 0.15}  # assumption
tiers: {high: 0.66, moderate: 0.33}   # assumption, exposed as sliders in the app
top_k: 8                              # "top tier" for p_top_tier = rank within top k cadasters
domains:
  clinical_demand:
    - {name: pregnant_per_1000, safe: 6, crisis: 14, level: cadaster, source: "pregnant_est / population (UNFPA ratio ~4.1% of women 15-49)", status: assumption}
    - {name: women_share, safe: 0.20, crisis: 0.27, level: cadaster, source: women_15_49 / population, status: assumption}
  capacity_strain:
    - {name: access_deficit, safe: 0.0, crisis: 1.0, level: cadaster, source: "M1: 1 - current access / pre-2026 median access", status: assumption}
    - {name: phc_per_50k, safe: 2, crisis: 0, level: cadaster, source: "Health Sector threshold: 2 PHC per 50,000 (open PHCs within 30 min)", status: verified}
    - {name: anc_share_30min, safe: 1.0, crisis: 0.0, level: cadaster, source: "share of open facilities within 30 min offering ANC", status: assumption}
  vulnerability:
    - {name: ipc3plus_share, safe: 0.05, crisis: 0.40, level: district, source: IPC Lebanon, status: assumption}
    - {name: unable_to_access_care_share, safe: 0.05, crisis: 0.20, level: district, source: "Health Sector sector threshold 20%", status: assumption}
    - {name: no_insurance_share, safe: 0.20, crisis: 0.80, level: district, source: assumption, status: assumption}
    - {name: female_headed_hh_share, safe: 0.10, crisis: 0.35, level: district, source: assumption, status: assumption}
    - {name: conflict_incidents, safe: 0, crisis: 40, level: cadaster, source: "LRP 2026 conflict incidents since Oct 2023 (admin 3); crisis value is an assumption", status: assumption}
    - {name: unregistered_workers_share, safe: 0.0, crisis: 0.12, level: cadaster, source: "assumption (document estimation method)", status: assumption}
  environment:
    - {name: soil_hotspot_proximity, safe: 0, crisis: 3, level: cadaster, source: "M4 tier x distance decay (15 km)", status: assumption}
    - {name: nitrate_mg_l, safe: 10, crisis: 50, level: cadaster, source: "WHO guideline 50 mg/L (crisis); wells imputed from district where unmeasured", status: verified}
