[project]
name = "beqaa"
version = "0.1.0"
description = "Beqaa Health Prioritization Framework & Dashboard"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "anthropic", "scipy", "matplotlib", "streamlit", "plotly"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
